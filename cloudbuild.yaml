# Cloud Build: build backend, push para Artifact Registry, deploy no Cloud Run
# Trigger: push na branch main (repositório athena272/conos)
#
# Pré-requisitos (uma vez):
#   1. Artifact Registry: gcloud artifacts repositories create conos --repository-format=docker --location=us-central1
#   2. Secret Manager – criar o secret com a senha do banco e dar acesso ao Cloud Run:
#      echo -n "SUA_SENHA_DO_BANCO" | gcloud secrets create conos-db-password --data-file=-
#      gcloud secrets add-iam-policy-binding conos-db-password \
#        --member="serviceAccount:PROJECT_NUMBER-compute@developer.gserviceaccount.com" \
#        --role="roles/secretmanager.secretAccessor"
#      (substitua PROJECT_NUMBER pelo número do projeto ou use: gcloud projects describe smooth-helper-486601-t3 --format="value(projectNumber)")

substitutions:
  _REGION: us-central1
  _PROJECT_ID: smooth-helper-486601-t3
  _REPOSITORY: conos
  _IMAGE_NAME: backend
  _SERVICE_NAME: conos-api
  _CONNECTION_NAME: smooth-helper-486601-t3:us-central1:conos-db-beta
  _SECRET_DB_PASSWORD: conos-db-password
  # Origens CORS (URL do frontend na Vercel; vírgula para várias)
  _ALLOWED_ORIGINS: ''

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # 1. Build da imagem Docker do backend
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:latest
      - .
    dir: backend

  # 2. Push para Artifact Registry
  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA
    waitFor: [build]

  # 3. Deploy no Cloud Run (com Cloud SQL)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --add-cloudsql-instances
      - ${_CONNECTION_NAME}
      - --set-env-vars
      - INSTANCE_CONNECTION_NAME=${_CONNECTION_NAME},DB_USER=conos,DB_NAME=conos,ALLOWED_ORIGINS=${_ALLOWED_ORIGINS}
      - --set-secrets
      - DB_PASSWORD=${_SECRET_DB_PASSWORD}:latest
    waitFor: [push]

# Imagem resultante (opcional, para uso em outros steps)
images:
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:latest
