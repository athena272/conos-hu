services:
  db:
    image: mysql:8.0
    container_name: conos-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-conos}
      MYSQL_USER: ${MYSQL_USER:-conos}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - conos_mysql_data:/var/lib/mysql
    healthcheck:
      # Usa a env dentro do container ($$ vira $ no YAML do Compose).
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  conos_mysql_data:
